<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notification-pipeline-title notification-pipeline-desc" id="notification-pipeline-root">
        <title id="notification-pipeline-title">Ticket 通知派送流程</title>
        <desc id="notification-pipeline-desc">新工單或狀態變更由資料庫觸發器寫入 notification_log，pg_net 以帶密鑰的 POST 喚醒 Edge Function；後者認領通知並呼叫 Resend 寄信，失敗時只記錄錯誤與重試時間，不阻斷工單流程。</desc>
        <defs>
      <style>#notification-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'Courier New', monospace; }
      #notification-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #notification-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#notification-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="notification-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="notification-pipeline-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="notification-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="notification-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- alt fragment frame -->
        <rect x="218" y="252" width="654" height="248" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="218" y="252" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="238" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="232" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[send ok]</text>
        <line x1="226" y1="420" x2="864" y2="420" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="232" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[retry &lt;= 5]</text>

        <!-- lifelines -->
        <line x1="100" y1="112" x2="100" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="290" y1="112" x2="290" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="480" y1="112" x2="480" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="670" y1="112" x2="670" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="860" y1="112" x2="860" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- messages -->
        <line x1="100" y1="150" x2="290" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="173" y="130" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="195" y="139" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

        <line x1="290" y1="178" x2="100" y2="178" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="165" y="158" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="195" y="167" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">delivery_id</text>

        <line x1="100" y1="206" x2="420" y2="206" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="242" y="186" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="195" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">invoke</text>

        <line x1="420" y1="234" x2="670" y2="234" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow-link)"/>
        <rect x="519" y="214" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="545" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">http_post</text>

        <line x1="670" y1="312" x2="290" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="462" y="292" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">claim</text>

        <line x1="290" y1="336" x2="670" y2="336" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="458" y="316" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="325" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">claimed</text>

        <line x1="670" y1="368" x2="860" y2="368" stroke="#bf4520" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow-accent)"/>
        <rect x="731" y="348" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="765" y="357" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /emails</text>

        <line x1="860" y1="392" x2="670" y2="392" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="747" y="372" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="765" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 ok</text>

        <line x1="670" y1="468" x2="290" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#notification-pipeline-arrow)"/>
        <rect x="452" y="448" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="457" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">last_error</text>

        <!-- activation bar -->
        <rect x="666" y="300" width="8" height="172" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- actors -->
        <rect x="40" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="100" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">DB 觸發器</text>
        <text x="100" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">after INSERT</text>

        <rect x="230" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="290" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">通知佇列</text>
        <text x="290" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">notification_log</text>

        <rect x="420" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">pg_net</text>
        <text x="480" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">async http</text>

        <rect x="610" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="670" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Edge Function</text>
        <text x="670" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">send-ticket-email</text>

        <rect x="800" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="860" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Resend</text>
        <text x="860" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">api.resend.com</text>

        <!-- legend -->
        <line x1="30" y1="540" x2="930" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="553" x2="144" y2="553" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow)"/>
        <text x="152" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">同步呼叫</text>
        <line x1="244" y1="553" x2="268" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#notification-pipeline-arrow)"/>
        <text x="276" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">回傳</text>
        <line x1="348" y1="553" x2="372" y2="553" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow-link)"/>
        <text x="380" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">外部 API</text>
        <line x1="472" y1="553" x2="496" y2="553" stroke="#bf4520" stroke-width="1.2" marker-end="url(#notification-pipeline-arrow-accent)"/>
        <text x="504" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">寄信主路徑</text>
        <rect x="608" y="548" width="12" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <text x="626" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">條件分支</text>
      </svg>

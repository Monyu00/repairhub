<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ticket-status-title ticket-status-desc" id="ticket-status-root">
        <title id="ticket-status-title">Ticket 工單狀態機</title>
        <desc id="ticket-status-desc">工單從待處理經接單、完工回報進入待確認完工，可由報修者確認驗收或未完成重開，逾期七天未回覆由 pg_cron 自動關單；管理員可將進行中的工單退回待處理或取消。</desc>
        <defs>
      <style>#ticket-status-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, 'Courier New', monospace; }
      #ticket-status-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ticket-status-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ticket-status-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="ticket-status-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ticket-status-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ticket-status-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- transitions -->
        <line x1="64" y1="152" x2="104" y2="152" stroke="#2d3142" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="68" y="126" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="84" y="138" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">開單</text>

        <line x1="254" y1="152" x2="306" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="264" y="132" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="280" y="144" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">接單</text>

        <line x1="456" y1="152" x2="508" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="466" y="132" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="482" y="144" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">完工</text>

        <line x1="658" y1="152" x2="710" y2="152" stroke="#bf4520" stroke-width="1.2" marker-end="url(#ticket-status-arrow-accent)"/>
        <rect x="668" y="132" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="684" y="144" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">驗收</text>

        <path d="M600,184 V210 H607 a 8,8 0 0,1 16,0 H780 V184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ticket-status-arrow)"/>
        <rect x="643" y="186" width="94" height="16" rx="2" fill="#f5f5f5"/>
        <text x="690" y="198" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">7 天自動關單</text>

        <path d="M615,184 V260 H436 V184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="497" y="236" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="525" y="248" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">重開單</text>

        <path d="M360,184 V240 H240 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="266" y="216" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="300" y="228" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">退回待處理</text>

        <line x1="170" y1="216" x2="170" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="178" y="246" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="194" y="258" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">取消</text>

        <path d="M400,184 V332 H254" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-status-arrow)"/>
        <rect x="408" y="246" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="424" y="258" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">取消</text>

        <!-- terminal connectors -->
        <line x1="860" y1="152" x2="878" y2="152" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="886" cy="152" r="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="886" cy="152" r="5" fill="#2d3142"/>
        <line x1="254" y1="332" x2="272" y2="332" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="280" cy="332" r="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="280" cy="332" r="5" fill="#2d3142"/>

        <!-- states -->
        <rect x="104" y="120" width="150" height="64" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="179" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">待處理</text>
        <text x="179" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pending</text>

        <rect x="306" y="120" width="150" height="64" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="381" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">進行中</text>
        <text x="381" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in_progress</text>

        <rect x="508" y="120" width="150" height="64" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="583" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">待確認完工</text>
        <text x="583" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">completed</text>

        <rect x="710" y="120" width="150" height="64" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="785" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">已結案</text>
        <text x="785" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">closed</text>

        <rect x="104" y="300" width="150" height="64" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="179" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">已取消</text>
        <text x="179" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cancelled</text>

        <!-- legend -->
        <line x1="30" y1="540" x2="930" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <circle cx="146" cy="553" r="5" fill="#2d3142"/>
        <text x="158" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">起始</text>
        <circle cx="230" cy="553" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="230" cy="553" r="3" fill="#2d3142"/>
        <text x="244" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">結束</text>
        <rect x="316" y="548" width="12" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="334" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">狀態</text>
        <rect x="396" y="548" width="12" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="414" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">等待報修者</text>
        <line x1="540" y1="553" x2="564" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="572" y="557" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">系統自動</text>
      </svg>

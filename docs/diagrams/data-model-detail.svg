      #data-model-detail-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK TC', ui-monospace, 'Courier New', monospace; }
      #data-model-detail-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-model-detail-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#data-model-detail-root .diagram-container { overflow-x: visible; }
}</style>
